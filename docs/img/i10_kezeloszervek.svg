<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img"><title>Turnigy i10 kezelőszervek és javasolt funkciók</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5b6a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:DejaVu Sans, Arial, Helvetica, sans-serif;fill:#1d2830}.th{font-size:14px;font-weight:bold}.ts{font-size:12px;fill:#5b6a72}.tx{font-size:12px}.leader{stroke:#5b6a72;stroke-width:0.8;stroke-dasharray:3 3;fill:none}</style><rect width="920" height="460" fill="#ffffff"/><rect x="250" y="70" width="420" height="330" rx="40" fill="#f3f4f4" stroke="#888780" stroke-width="1.2"/><rect x="405" y="40" width="110" height="50" rx="14" fill="#f3f4f4" stroke="#888780"/><circle cx="425" cy="62" r="11" fill="#fff" stroke="#1d2830"/><text x="425" y="30" text-anchor="middle" class="tx" style="font-weight:bold">VrA</text><circle cx="460" cy="62" r="11" fill="#fff" stroke="#1d2830"/><text x="460" y="30" text-anchor="middle" class="tx" style="font-weight:bold">VrB</text><circle cx="495" cy="62" r="11" fill="#fff" stroke="#1d2830"/><text x="495" y="30" text-anchor="middle" class="tx" style="font-weight:bold">VrC</text><rect x="277" y="114" width="10" height="20" rx="3" fill="#1d2830"/><text x="282" y="148" text-anchor="middle" style="font-size:11px;font-weight:bold">SwA</text><rect x="313" y="94" width="10" height="20" rx="3" fill="#1d2830"/><text x="318" y="128" text-anchor="middle" style="font-size:11px;font-weight:bold">SwB</text><rect x="349" y="114" width="10" height="20" rx="3" fill="#1d2830"/><text x="354" y="148" text-anchor="middle" style="font-size:11px;font-weight:bold">SwC</text><rect x="375" y="94" width="10" height="20" rx="3" fill="#1d2830"/><text x="380" y="128" text-anchor="middle" style="font-size:11px;font-weight:bold">SwD</text><rect x="535" y="94" width="10" height="20" rx="3" fill="#1d2830"/><text x="540" y="128" text-anchor="middle" style="font-size:11px;font-weight:bold">SwE</text><rect x="561" y="114" width="10" height="20" rx="3" fill="#1d2830"/><text x="566" y="148" text-anchor="middle" style="font-size:11px;font-weight:bold">SwF</text><rect x="597" y="94" width="10" height="20" rx="3" fill="#1d2830"/><text x="602" y="128" text-anchor="middle" style="font-size:11px;font-weight:bold">SwG</text><rect x="633" y="114" width="10" height="20" rx="3" fill="#1d2830"/><text x="638" y="148" text-anchor="middle" style="font-size:11px;font-weight:bold">SwH</text><circle cx="345" cy="240" r="55" fill="#fff" stroke="#888780"/><circle cx="345" cy="240" r="9" fill="#1d2830"/><circle cx="575" cy="240" r="55" fill="#fff" stroke="#888780"/><circle cx="575" cy="240" r="9" fill="#1d2830"/><rect x="425" y="190" width="70" height="120" rx="6" fill="#dbe8f5" stroke="#378ADD"/><text x="460" y="255" text-anchor="middle" style="font-size:11px">kijelző</text><text x="345" y="320" text-anchor="middle" class="ts">bal bot: gáz / oldalkormány</text><text x="575" y="320" text-anchor="middle" class="ts">jobb bot: magassági / csűrő</text><text x="460" y="420" text-anchor="middle" class="ts">VrD, VrE: oldalsó karok – bal: differenciál tolóerő erőssége, jobb: szabad</text><rect x="20" y="150" width="210" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text class="th" x="125" y="170" text-anchor="middle" style="fill:#3C3489">SwA (3 állás)</text><text x="125" y="187" text-anchor="middle" style="font-size:11px;fill:#534AB7">fékszárny: fel / félig / le</text><path d="M230 174 L252 174 L282 136" class="leader"/><rect x="20" y="212" width="210" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text class="th" x="125" y="232" text-anchor="middle" style="fill:#3C3489">SwB (2 állás)</text><text x="125" y="249" text-anchor="middle" style="font-size:11px;fill:#534AB7">futómű ki / be</text><path d="M230 236 L288 236 L318 116" class="leader"/><rect x="20" y="274" width="210" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text class="th" x="125" y="294" text-anchor="middle" style="fill:#085041">SwC (2 állás)</text><text x="125" y="311" text-anchor="middle" style="font-size:11px;fill:#0F6E56">differenciál tolóerő be (vízen)</text><path d="M230 298 L324 298 L354 136" class="leader"/><rect x="20" y="336" width="210" height="48" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text class="th" x="125" y="356" text-anchor="middle" style="fill:#712B13">SwD (2 állás)</text><text x="125" y="373" text-anchor="middle" style="font-size:11px;fill:#993C1D">gázlekapcsolás (biztonság)</text><path d="M230 360 L350 360 L380 116" class="leader"/><rect x="690" y="150" width="210" height="48" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text class="th" x="795" y="170" text-anchor="middle" style="fill:#444441">SwE (2 állás)</text><text x="795" y="187" text-anchor="middle" style="font-size:11px;fill:#888780">szabad</text><path d="M690 174 L570 174 L540 116" class="leader"/><rect x="690" y="212" width="210" height="48" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text class="th" x="795" y="232" text-anchor="middle" style="fill:#085041">SwF (3 állás)</text><text x="795" y="249" text-anchor="middle" style="font-size:11px;fill:#0F6E56">le: tölt / közép: zárva / fel: ürít</text><path d="M690 236 L596 236 L566 136" class="leader"/><rect x="690" y="274" width="210" height="48" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text class="th" x="795" y="294" text-anchor="middle" style="fill:#444441">SwG (rugós)</text><text x="795" y="311" text-anchor="middle" style="font-size:11px;fill:#888780">időzítő indítás / nullázás</text><path d="M690 298 L632 298 L602 116" class="leader"/><rect x="690" y="336" width="210" height="48" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text class="th" x="795" y="356" text-anchor="middle" style="fill:#444441">SwH (2 állás)</text><text x="795" y="373" text-anchor="middle" style="font-size:11px;fill:#888780">kormánykitérés: kicsi / nagy</text><path d="M690 360 L668 360 L638 136" class="leader"/><rect x="690" y="30" width="210" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text class="th" x="795" y="50" text-anchor="middle" style="fill:#633806">VrA tekerő</text><text x="795" y="67" text-anchor="middle" style="font-size:11px;fill:#854F0B">fénymód: ki / helyzet / mind</text><path d="M690 54 L520 54 L437 58" class="leader"/><rect x="20" y="30" width="210" height="48" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text class="th" x="125" y="50" text-anchor="middle" style="fill:#444441">VrB, VrC</text><text x="125" y="67" text-anchor="middle" style="font-size:11px;fill:#888780">szabad (pl. finomhangolás)</text><path d="M230 54 L400 54 L455 58" class="leader"/><text x="460" y="440" text-anchor="middle" class="ts">Javasolt kiosztás, Mode 2. A kapcsolók állásszámát a kézikönyv szerint adtam meg; a te példányodon a Display menüben ellenőrizd.</text></svg>