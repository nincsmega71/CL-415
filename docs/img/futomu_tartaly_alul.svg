<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" role="img"><title>Alulnézet: ajtók és merítőlapok</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#993C1D"/></marker></defs><style>text{font-family:DejaVu Sans, Arial, Helvetica, sans-serif;fill:#1d2830}.t{font-size:13px}.th{font-size:15px;font-weight:bold}.ts{font-size:11px;fill:#5b6a72}.d{font-size:11px;fill:#993C1D}</style><rect width="940" height="460" fill="#fff"/><rect x="198.0" y="118.0" width="688.0" height="264.0" fill="none" stroke="#888780" stroke-width="2"/><line x1="198.0" y1="250.0" x2="886.0" y2="250.0" stroke="#5b6a72" stroke-dasharray="8 4"/><text class="ts" x="206.0" y="246.0">gerinc</text><line x1="530.8" y1="118.0" x2="530.8" y2="382.0" stroke="#1d2830" stroke-width="2"/><text class="t" x="534.8" y="152.0">lépcső</text><rect x="430.0" y="186.0" width="80.0" height="51.2" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/><rect x="542.0" y="218.8" width="16.0" height="24.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/><rect x="516.4" y="118.0" width="105.60000000000001" height="12.8" fill="#F1EFE8" stroke="#5F5E5A"/><rect x="430.0" y="262.8" width="80.0" height="51.2" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/><rect x="542.0" y="257.2" width="16.0" height="24.0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/><rect x="516.4" y="369.2" width="105.60000000000001" height="12.8" fill="#F1EFE8" stroke="#5F5E5A"/><text class="t" x="470.0" y="404.0" text-anchor="middle">2 ürítőajtó (bal és jobb rekesz), 50 × 32 mm</text><text class="t" x="580.0" y="94.0">2 merítőlap 10 × 15 mm-es ráccsal</text><line x1="578.0" y1="90.0" x2="550.0" y2="218.0" stroke="#5b6a72" stroke-dasharray="3 3"/><text class="t" x="639.2" y="430.0">főfutó-aknák (oldalt nyitottak)</text><line x1="637.2" y1="426.0" x2="569.2" y2="386.0" stroke="#5b6a72" stroke-dasharray="3 3"/><line x1="430.0" y1="174.8" x2="510.0" y2="174.8" stroke="#993C1D" stroke-width="0.8" marker-start="url(#a)" marker-end="url(#a)"/><text class="d" x="470.0" y="170.8" text-anchor="middle">50</text><text class="th" x="30" y="28">Alulnézet a súlypont környékén</text><text class="ts" x="30" y="46">Elöl balra. Az ajtók a V-fenék két oldalán, a gerinctől 8 mm-re; a merítőlapok közvetlenül a lépcső mögött, a gerinc két oldalán.</text></svg>