rúd (tömített cső)</text><line x1="174.0" y1="143.8" x2="486.0" y2="143.8" stroke="#993C1D" stroke-width="0.8" marker-start="url(#a)" marker-end="url(#a)"/><text class="d" x="330.0" y="139.8" text-anchor="middle">130 (külső)</text><line x1="103.2" y1="373.0" x2="103.2" y2="173.8" stroke="#993C1D" stroke-width="0.8" marker-start="url(#a)" marker-end="url(#a)"/><text class="d" x="97.2" y="277.4" text-anchor="end">83</text><text class="t" x="252.0" y="289.0" text-anchor="middle">bal rekesz</text><text class="t" x="408.0" y="289.0" text-anchor="middle">jobb rekesz</text><text class="ts" x="330.0" y="418.6" text-anchor="middle">V-fenék 24°-os hajlással, a hajótesttel együtt; az ajtók a chine felőli élükön csuklósak</text><text class="th" x="30" y="28">Tartály keresztmetszet (elölről), belső térfogat kb. 557 ml</text><text class="ts" x="30" y="46">Két rekesz, 2 mm-es PETG falakkal; mindkét rekesz alján egy-egy ürítőajtó (narancs, szaggatva: nyitva).</text></svg>